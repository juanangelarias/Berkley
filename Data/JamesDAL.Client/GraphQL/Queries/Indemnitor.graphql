query GetIndemnitorsByAccount($accountNum: String!) {
    indemnitorsByAccount(accountNum: $accountNum){
        accountNum
        agreementDate
        agreementForm
        agreementType
        docuSign
        details {
            encryptSpouseTaxId
            executionDate
            fullName
            id
            indemnityAmount
            netLiquidAssets
            netWorth
            signatory
            spouseIndemnitor
            title
        }
    }
}