query GetAccountByNumber($accountNumber: String) {
  accountByNumber(accountNumber: $accountNumber) {
    idNavigation {
      fullName
      legalEntityAddresses {
        type
        address {
          address1
          address2
          address3
          city
          stateCode
          stateCodeNavigation {
            countryCode
            countryCodeNavigation {
              name
            }
          }
          postalCode
        }
      }
      legalEntityPhones {
        type
        phoneNumber {
          mainNumber
          extension
        }
      }
      legalEntityEmails {
        type
        emailAddress
      }
    }
    bank
    agent {
      idNavigation {
        fullName
      }
    }
    agencyNumberNavigation {
      idNavigation {
        fullName
        legalEntityAddresses {
          type
          address {
            city
            stateCode
          }
        }
      }
    }
    accountNum
    division
    homeOfficeReviewByNavigation {
      fullName
    }
    homeOfficeReviewed
    branchReviewByNavigation {
      fullName
    }
    branchReviewed
    attorney {
      idNavigation {
        fullName
      }
      martindaleHubbellRating
    }
    underwriter {
      idNavigation {
        fullName
        initials
        title
        email
      }
      reportsTo
    }
    bankPhone {
      countryCode
      created
      extension
      id
      mainNumber
      modified
    }
    cpafirm {
      created
      entityType
      familyName
      fullName
      givenName
      id
      isIndividual
      middleInitial
      modified
      parent
      taxIdEncrypted
      website
      legalEntityPhones {
        legalEntityId
        phoneNumberId
        type
      }
    }
    cpacontact {
      created
      entityType
      familyName
      fullName
      givenName
      id
      isIndividual
      middleInitial
      modified
      parent
      taxIdEncrypted
      website
    }
    businessTypeNavigation {
      businessType
      created
      id
      modified
    }
    businessTypeClassNavigation {
      businessType
      classCode
      created
      id
      isContract
      modified
    }
  }
}
    creditReportImagingId
  }
}

query SearchAccounts($input: String!) {
  searchAccounts(searchString: $input) {
    accountNum
    idNavigation {
      fullName
    }
  }
}

query GetAccountActiveLinesOfAuthority($input: String!) {
  accountActiveLinesOfAuthority(accountNumber: $input) {
    accountNum
    commercialLOA {
      accountNum
      approved
      approvedBy
      bondType
      comments
      conditions
      created
      createdBy
      division
      effective
      expiration
      homeOfficeApproved
      id
      loaaggregate
      loasingle
      modified
      sequenceNumber
      status
    }
    contractLOA {
      accountNum
      approved
      approvedBy
      bondType
      comments
      conditions
      created
      createdBy
      division
      effective
      expiration
      homeOfficeApproved
      id
      loaaggregate
      loasingle
      modified
      sequenceNumber
      status
    }
  }
} 

query GetAccountProgramHistory($input: String!) {
  accountProgramHistory(accountNumber: $input) {
    accountNum
    aggregate
    approvedBy
    approvedDate
    comments
    created
    createdBy
    effective
    expiration
    homeOfficeApproved
    id
    modified
    single
    statusId
    accountProgramStatusHistories {
      accountProgramId
      accountNum
      created
      id
      modified
      newAggregate
      newSingle
      newStatus
      oldAggregate
      oldSingle
      oldStatus
      statusChangeBy
      statusDate
    }
  }
} 