query GetAllNotifications {
    notifications {
        accountNumber
        body
        followUpDate
        id
        sendEmail
        senderUserEmail
        senderUserId
        sendSms
        status
        title
        properties {
            id
            notificationId
            notificationPropertyId
            stringTxt
            type
            notificationProperty {
                id
                name
                type
            }
        }
        recipients {
            id
            name
            notificationId
            recipientEmail
            recipientPhoneNumber
        }
    }
}

query GetAllNotificationsByUser($userEmail: String!, $accountNumber: String) {
    notificationsByUser(userEmail: $userEmail, accountNumber: $accountNumber) {
        accountNumber
        body
        followUpDate
        id
        sendEmail
        senderUserEmail
        senderUserId
        sendSms
        status
        title
        properties {
            id
            notificationId
            notificationPropertyId
            stringTxt
            type
            notificationProperty {
                id
                name
                type
            }
        }
        recipients {
            id
            name
            notificationId
            recipientEmail
            recipientPhoneNumber
        }
    }
}

query GetAllNotificationProperties {
    notificationProperties {
        id
        name
        type
    }
}