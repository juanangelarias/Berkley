    STRING
    STRING_LIST
    DATE
    DATE_LIST
    INTEGER
    INTEGER_LIST
    DOUBLE
    DOUBLE_LIST
    CHOICE_LIST_STRING
    CHOICE_LIST_INTEGER
    CHOICE_LIST_STRING_MULTI
    CHOICE_LIST_INTEGER_MULTI
    BOOLEAN
    BOOLEAN_LIST
    UNKOWN
}

enum SearchResultType {
    UNSET
    ACCOUNT
    BOND
    BOND_LIST
    AGENCY
    OBLIGEE
    FILE
    PERSON
}

