query GetAgencyByAgencyNumber($agencyNumber: String!)
{
	agencyByAgencyNumber(agencyNumber:$agencyNumber)
    {
		agencyNumber,
        branch,
        status,
		agentsInAgencies{
			agent{
				mainEmailAddress,
                nationalProducerNumber,
                idNavigation{
                    fullName,
                    givenName,
                    middleInitial,
                    familyName,
                    agencyLicenseAgents{
                        status,
                        licenseNumber,
                        state,
                        isResident,
                        appointingState,
                        appointment
                    }
                }
			}
		}
		idNavigation
        {
			fullName,
			legalEntityAddresses
            {
				type,
				address
                {
                    address1,
                    address2,
                    address3,
                    city,
                    stateCode,
                    stateCodeNavigation 
                    {
                        countryCode,
                        countryCodeNavigation 
                        {
                            name
                        }     
                    },
                    postalCode
                }
			}
		}
	}
}