query GetAccountActiveLinesOfAuthority($input: String!) {
  accountActiveLinesOfAuthority(accountNumber: $input) {
    accountNum
    commercialLOA {
      accountNum
      approved
      approvedBy
      bondType
      comments
      conditions
      created
      createdBy
      division
      effective
      expiration
      homeOfficeApproved
      id
      loaaggregate
      loasingle
      modified
      sequenceNumber
      status
    }
    contractLOA {
      accountNum
      approved
      approvedBy
      bondType
      comments
      conditions
      created
      createdBy
      division
      effective
      expiration
      homeOfficeApproved
      id
      loaaggregate
      loasingle
      modified
      sequenceNumber
      status
    }
  }
} 

query GetAccountProgramHistory($input: String!) {
  accountProgramHistory(accountNumber: $input) {
    accountNum
    aggregate
    approvedBy
    approvedDate
    comments
    created
    createdBy
    effective
    expiration
    homeOfficeApproved
    id
    modified
    single
    statusId
    accountProgramStatusHistories {
      accountProgramId
      accountNum
      created
      id
      modified
      newAggregate
      newSingle
      newStatus
      oldAggregate
      oldSingle
      oldStatus
      statusChangeBy
      statusDate
    }
  }
} 