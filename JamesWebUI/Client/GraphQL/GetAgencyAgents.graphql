query GetAgencyAgents($agencyId: UUID!){
	agencyAgents(agencyId: $agencyId){
        agentId,
        agent{
            fullName,
            givenName,
            middleInitial,
            familyName,
            mainEmailAddress,
            nationalProducerNumber,
            idNavigation{
                givenName,
                middleInitial,
                familyName,
                fullName
            }
        }
    }
}