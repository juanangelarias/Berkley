subscription AddressModified($addressId: ID!) {
  onAddressModified(addressId: $addressId) {
    identifier
    result {
      address1
      address2
      address3
      city
      stateCode
      postalCode
      id
    }
  }
}

subscription AddressCollectionModified($legalEntityId: ID!) {
  onAddressCollectionModified(legalEntityId: $legalEntityId) {
    identifier
  }
}
