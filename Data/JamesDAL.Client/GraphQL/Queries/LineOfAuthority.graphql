query GetAccountPrograms($accountNum: String!){
    accountPrograms(accountNum: $accountNum){
        id
        createdBy
        accountNum
        single
        aggregate
        effective
        expiration
        status
        approvedBy
        approvedDate
        logs {
            id
            statusDate
            statusChangeByFullName
            oldSingle
            newSingle
            oldAggregate
            newAggregate
            oldStatus
            newStatus
        }
    }
}

query GetAccountProgramById($id: UUID!) {
    accountProgramById(id: $id) {
        id
        createdBy
        accountNum
        single
        aggregate
        effective
        expiration
        status
        approvedBy
        approvedDate
        logs {
            id
            statusDate
            statusChangeByFullName
            oldSingle
            newSingle
            oldAggregate
            newAggregate
            oldStatus
            newStatus
        }
    }
}

query GetLoaLogsByAccount($accountNum: String!) {
    loaLogsByAccount(accountNumber: $accountNum) {
        id
        accountNum
        approvedById
        approvedByName
        bondType
        comments
        conditions
        created
        createdById
        createdByName
        division
        effective
        expiration
        homeOfficeApproved
        loaAggregate
        loaSingle
        sequenceNumber
        status
    }
}