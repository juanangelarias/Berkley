query GetAgencyByAgencyNumber($agencyNumber: String!)
{
	agencyByAgencyNumber(agencyNumber:$agencyNumber)
    {
        id,
		agencyNumber,
        branch,
        status,
        w9,
        nasbp,
        agents{
            fullName,
            givenName,
            middleInitial,
            familyName,
            mainEmailAddress,
            nationalProducerNumber,
            licenses{
                agencyId,
                state,
                licenseNumber,
                isResident,
                expiration,
                comments,
                isActive,
                appointment,
                termination,
                appointingState,
                insurer{
                    fullName
                }
            }
        }
		idNavigation
        {
			fullName,
			legalEntityAddresses
            {
				type,
				address
                {
                    address1,
                    address2,
                    address3,
                    city,
                    stateCode,
                    stateCodeNavigation 
                    {
                        countryCode,
                        countryCodeNavigation 
                        {
                            name
                        }     
                    },
                    postalCode
                }
			}
		}
	}
}
