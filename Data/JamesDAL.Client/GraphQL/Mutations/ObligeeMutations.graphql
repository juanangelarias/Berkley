mutation CreateObligee($input: CreateObligeeInput!) {
  createObligee(input: $input) {
    obligee {
      id
      obligeeNum
      idNavigation {
        created
        entityType
        familyName
        fullName
        givenName
        id
        isIndividual
        middleInitial
        modified
        parent
        taxIdEncrypted
        website
      }
    }
  }
}