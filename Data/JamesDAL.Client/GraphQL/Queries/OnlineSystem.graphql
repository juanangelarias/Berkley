query GetOnlineSystems {
    onlineSystems {
        id
        systemName
    }
}

query GetOnlineBondSystemsByLegalEntity($entityId: UUID!) {
    onlineBondSystemsByLegalEntity(legalEntityId: $entityId) {
        id
        insurerId
        insurer {
            idNavigation {
                fullName
            }
        }
        systemName
    }
}