query GetAccountLOAs($input: String!) {
    accountLOAs(accountNum: $input) {
        accountLOAs {
            aggregate
            bondType
            effective
            expiration
            single
            status
        }
        agencyLOAs {
            aggregate
            bondType
            effective
            expiration
            single
            status
        },
        loaTotal
    }
}

query GetAllContractRates {
    allContractRates {
        id
