query GetAllUserSettings {
    allUserSettings {
        key
        value
    }
}

query GetUserEmployeeInfo($userName: String!) {
    userEmployeeInfo(username: $userName){
        employeeId
        username
        fullName
        title
        email
        isUnderwriter
    }
}

query GetUserLOAByDivision($division: String!) {
    userLOAByDivision(division: $division) {
        id
        divisionCode
        bondType
        expiration
        single
        aggregate
    }
}