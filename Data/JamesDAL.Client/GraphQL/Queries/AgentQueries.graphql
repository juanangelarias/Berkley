query agentByAgentId($agentId: UUID!) {
    agentByAgentId(agentId: $agentId) {
        id
        idNavigation {
            entityType
            familyName
            fullName
            givenName
            id
            isIndividual
            middleInitial
            parent
            taxIdEncrypted
            website
        }
        nationalProducerNumber
        agentsInAgencies {
            active
            agencyId
            agentId
            attorneyInFact
            comments
            id
            portalUser
        }
        agencyLicenses {
            agencyId
            agentId
            appointingState
            appointment
            comments
            expiration
            id
            isActive
            isResident
            licenseNumber
            state
            termination
            insurer {
                active
                currencyCountry
                defaultRateGroup
                fullName
                id
                lenumPeopleSoft
                mainEmailAddress
                idNavigation {
                    entityType
                    familyName
                    fullName
                    givenName
                    id
                    isIndividual
                    middleInitial
                    parent
                    taxIdEncrypted
                    website
                }
            }
        }
        emailAddresses {
            id
            type
            emailAddress
        }
    }
}

query SearchAgents($input: String!) {
	searchAgents(searchString: $input) {
	id
	idNavigation {
		fullName
	}
	}
} 

query GetAgentByNationalProducerNumber($nationalProducerNumber: String!, $agencyId: UUID!) {
    agentByNationalProducerNumber(agencyId: $agencyId, nationalProducerNumber: $nationalProducerNumber){
        id
        agencyId
        agencyName
        agencyNum
        agentId
        givenName
        middleInitial
        familyName
        fullName
        nationalProducerNumber
        email
        countryCode
        phoneNumber
        extension
        aif
    }
}