mutation SetAccountCurrentCreditReportLink($input: SetCurrentCreditReportLinkInput!) {
  setCurrentCreditReportLink(input: $input) {
    boolean
  }
}
mutation SetAccountGeneralInfo ($input: SetAccountGeneralInfoInput!){
  setAccountGeneralInfo (input: $input) {
    boolean
  }
} 
mutation SetAccountSystems ($input: SetAccountSystemsInput!){
  setAccountSystems (input: $input) {
    boolean
  }
} 
 mutation SetAccountAdditionalInformation ($input: SetAccountAdditionalInformationInput!){
  setAccountAdditionalInformation (input: $input) {
    boolean
  }
} 
mutation SetAccountProgram($input: SetAccountProgramInput!) {
  setAccountProgram(input: $input) {
    accountProgram {
      accountNum
      aggregate
      approvedBy
      approvedDate
      comments
      created
      createdBy
      effective
      expiration
      homeOfficeApproved
      id
      modified
      single
      statusId
    }
  }
} 

mutation SetAccountWatch($input: SetAccountWatchInput!) {
    setAccountWatch(input: $input) {
        accountWatch {
            watchStatusId
            watchStatus {
                watchStatus
                backgroundColor
            }
            watchDate
            reason
            oldWatchStatusId
            oldWatchStatus {
                watchStatus
                backgroundColor
            }
            id
            actionPlan
            accountId
        }
    }
}
