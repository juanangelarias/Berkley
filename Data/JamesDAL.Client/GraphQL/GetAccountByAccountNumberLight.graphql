query GetAccountByAccountNumberLight($accountNum: String) {
  accountOnly(accountNumber: $accountNum) {
    fullName
    addresses {
      type
      address {
        address1
        address2
        address3
        city
        stateCode
        state
        countryCode
        country
        postalCode
      }
    }
    phoneNumbers {
      type
      phoneNumber {
        mainNumber
        extension
      }
    }
    emailAddresses {
      type
      emailAddress
    }
    bank
    agent {
      fullName
    }
    agency {
      fullName
      addresses {
        type
        address {
          city
          stateCode
        }
      }
    }
    accountNum
    division
    homeOfficeReviewByNavigation {
      fullName
    }
    homeOfficeReviewed
    branchReviewByNavigation {
      fullName
    }
    branchReviewed
    attorney {
      idNavigation {
        fullName
      }
      martindaleHubbellRating
    }
    underwriter {
      idNavigation {
        fullName
        initials
        title
        email
      }
      reportsTo
    }
  }
}
