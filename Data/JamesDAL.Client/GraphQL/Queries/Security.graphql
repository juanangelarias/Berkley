query GetAllSecurityRoles {
  allSecurityRoles {
    id
    role
    description
    ord
  }
}

query GetSecurityRoleMembers($role: String!) {
  securityRoleMembers(role: $role) {
    id
    name
    isRole
  }
}

query GetEmployees($activeOnly: Boolean!) {
  employees(activeOnly: $activeOnly) {
    id
    active
    activeDirectoryAccount
    fullName
    title
    primaryBranchId
    initials
    email
    homeOfficeApprover
    underwriterIdNavigation {
      dropDownList
      notificationSendTo
      reportsToNavigation {
        id
        fullName
      }
    }
  }
}

query GetSecurityRolesByUser($input: UUID!) {
    securityRolesByUser(principalId: $input) {
        ord
        role
        description
        id
    }
}

mutation AddPrincipalToSecurityRole($input: AddPrincipalToSecurityRoleInput!) {
  addPrincipalToSecurityRole(input: $input) {
    boolean
  }
}

mutation RemovePrincipalFromSecurityRole($input:RemovePrincipalFromSecurityRoleInput!){
  removePrincipalFromSecurityRole(input:$input){
    boolean
  }
}

mutation AddSecurityRole($input: AddSecurityRoleInput!) {
  addSecurityRole(input: $input) {
    boolean
  }
} 