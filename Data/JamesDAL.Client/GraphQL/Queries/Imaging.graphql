query GetImagingSearchCriteria(
  $id: String!
  $docCategory: ImagingDocumentCategory!
  $useDocCategoryAsCriteria: Boolean! = true
) {
  imagingSearchCriteria(
    imagingId: $id
    docCategory: $docCategory
    useDocCategoryAsCriteria: $useDocCategoryAsCriteria
  ) {
    docClass
    fields
    maxResults
    whereClause
    searchTimeoutSeconds
    contentSearchString
  }
}

query GetImagingDocuments($id: String!, $category: ImagingDocumentCategory!, $type: String) {
  searchDocuments(imagingId: $id, docCategory: $category, documentType: $type) {
    contentList {
      filename
    }
    documentClass
    folderPath
    guid
    entryDate
    properties{
      name
      value
    }
  }
}

query GetImagingDocumentProperties($docCategory:ImagingDocumentCategory!, $guid:UUID!){
  documentDetails(docCategory: $docCategory, documentId: $guid){
    filename
  }
}

query GetAllImagingTypes {
  allImagingTypes {
    type
    description
  }
} 

query GetAllImagingCategoryTabDivisionTypes {
  allImagingCategoryTabDivisionType {
    category
    divisionCode
    tabDescription
    tabName
    type
    typeDescription
  }
} 
